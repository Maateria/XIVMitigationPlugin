name: Build and Release

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/stg/latest.zip" `
                            -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" "$env:RUNNER_TEMP\dalamud"
          echo "DALAMUD_HOME=$env:RUNNER_TEMP\dalamud" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore XIVMitigationPlugin/XIVMitigationPlugin.csproj

      - name: Build (Release)
        run: dotnet build XIVMitigationPlugin/XIVMitigationPlugin.csproj --configuration Release --no-restore

      - name: Read built version
        id: version
        shell: pwsh
        run: |
          $jsonPath = Get-ChildItem -Recurse "XIVMitigationPlugin/bin" -Filter "XIVMitigationPlugin.json" `
                      | Where-Object { $_.FullName -notlike "*\obj\*" } `
                      | Select-Object -First 1 -ExpandProperty FullName
          if (-not $jsonPath) { throw "XIVMitigationPlugin.json not found under XIVMitigationPlugin/bin" }
          Write-Host "Found manifest at: $jsonPath"
          $outDir = Split-Path $jsonPath -Parent
          echo "outdir=$outDir" >> $env:GITHUB_OUTPUT
          $json = Get-Content $jsonPath | ConvertFrom-Json
          $v = $json.AssemblyVersion
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "Detected version: $v"

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ steps.version.outputs.outdir }}\*" `
                           -DestinationPath "XIVMitigationPlugin.zip" -Force

      - name: Update pluginmaster.json
        shell: pwsh
        run: |
          $pm = Get-Content pluginmaster.json | ConvertFrom-Json
          $pm[0].AssemblyVersion = "${{ steps.version.outputs.version }}"
          $pm | ConvertTo-Json -Depth 10 | Set-Content pluginmaster.json -Encoding UTF8
          echo "pluginmaster.json updated to ${{ steps.version.outputs.version }}"

      - name: Commit pluginmaster.json
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          $diff = git diff --staged --name-only
          if ($diff) {
            git commit -m "chore: bump pluginmaster to v${{ steps.version.outputs.version }} [skip ci]"
            git push
          } else {
            echo "pluginmaster.json already up to date, nothing to commit."
          }

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          body: |
            Automatically built from the latest commit on `master`.
            **Version:** ${{ steps.version.outputs.version }}

            ### Installation
            Copy the URL below and add it to Dalamud → Settings → Experimental → Custom Plugin Repositories:
            ```
            https://raw.githubusercontent.com/Maateria/XIVMitigationPlugin/master/pluginmaster.json
            ```
          files: XIVMitigationPlugin.zip
          prerelease: false
